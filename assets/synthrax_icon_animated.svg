<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Synthrax" xmlns:c2pa="http://c2pa.org/manifest">
<g class="icon">
  <style>
  .ring { stroke-dasharray: 654; animation: draw 0.9s ease-out both; }
  .fill { animation: fade 0.6s 0.45s ease-out both; }
  .icon { transform-box: fill-box; transform-origin: center; animation: click 0.35s 1.7s ease-out both; }
  
  .r { animation: slideR 0.9s 0.9s cubic-bezier(.2,.9,.3,1.25) both; }
  .l { animation: slideL 0.9s 0.9s cubic-bezier(.2,.9,.3,1.25) both; }
  @keyframes draw { from { stroke-dashoffset: 654 } to { stroke-dashoffset: 0 } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideR { from { transform: translateX(110px) } to { transform: translateX(0) } }
  @keyframes slideL { from { transform: translateX(-110px) } to { transform: translateX(0) } }
  @keyframes click { 0% { transform: scale(1) } 40% { transform: scale(1.06) } 100% { transform: scale(1) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <clipPath id="inside"><circle cx="120" cy="120" r="100"/></clipPath>
  </defs>
  <circle cx="120" cy="120" r="100" fill="#fff"/>
  <g clip-path="url(#inside)">
    <polygon class="fill" points="0,0 0,240 240,240" fill="#01AA36"/>
    <g transform="rotate(-45 120 120)">
      <path class="r" d="M120,95 H175 A25,25 0 0 1 175,145 H120 Z" fill="#01AA36"/>
      <path class="l" d="M120.5,95 H65 A25,25 0 0 0 65,145 H120.5 Z" fill="#fff"/>
    </g>
  </g>
  <circle class="ring" cx="120" cy="120" r="104" fill="none" stroke="#06181D" stroke-width="9"
          transform="rotate(-135 120 120)"/>
</g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>